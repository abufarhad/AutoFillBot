<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Autofill Saver</title>
    <style>
        body {
            width: 400px;
            min-height: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background-color: #f8f9fa;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #212529;
            flex: 1;
        }

        .current-site {
            margin-bottom: 16px;
            padding: 10px 12px;
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .current-site strong {
            color: #0056b3;
            white-space: nowrap;
        }

        #currentSiteUrl {
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .save-form {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background-color 0.2s;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #218838;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #545b62;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #c82333;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 11px;
        }

        /* Global profile area */
        .global-profile {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .global-profile-info {
            font-size: 12px;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .global-profile-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Entry badge */
        .entry-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
            vertical-align: middle;
        }

        /* Saved profiles */
        .saved-profiles {
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            max-height: 240px;
            overflow-y: auto;
        }

        .profile-item {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .profile-item:last-child {
            border-bottom: none;
        }

        .profile-item:hover {
            background-color: #f8f9fa;
        }

        .profile-name {
            font-weight: 500;
            color: #212529;
            font-size: 13px;
        }

        .profile-meta {
            font-size: 11px;
            color: #6c757d;
            margin-top: 2px;
        }

        .profile-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-style: italic;
            font-size: 12px;
        }

        /* Status messages */
        #statusMessage {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        #statusMessage.status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #statusMessage.status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #statusMessage.status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .form-count {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .multi-entry-hint {
            font-size: 11px;
            color: #28a745;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 16px;
            color: #6c757d;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Form Autofill Saver</h1>
</div>

<!-- Status message -->
<div id="statusMessage" style="display: none;"></div>

<!-- Current site bar -->
<div class="current-site">
    <strong>Site:</strong>
    <span id="currentSiteUrl">Loading...</span>
    <button id="openDashboardBtn" class="btn btn-secondary btn-small" style="flex-shrink:0;">Manage</button>
</div>

<!-- ── Global Profile ─────────────────────────────────── -->
<div class="section">
    <div class="section-title">🌍 Global Profile</div>
    <div class="global-profile">
        <div id="globalProfileStatus" class="loading">Checking global profile...</div>
        <div id="globalProfileContainer" style="display: none;">
            <div id="globalProfileInfo" class="global-profile-info"></div>
            <div class="global-profile-actions">
                <button id="saveGlobalBtn" class="btn btn-primary" disabled>Save as Global Profile</button>
                <button id="useGlobalBtn"   class="btn btn-success" style="display: none;">Use Global</button>
                <button id="deleteGlobalBtn" class="btn btn-danger"  style="display: none;">Delete Global</button>
            </div>
        </div>
    </div>
</div>

<!-- ── Save Current Form ──────────────────────────────── -->
<div class="section">
    <div class="section-title">💾 Save Current Form</div>
    <div class="save-form">
        <div id="formDetectionStatus" class="loading">Detecting form fields...</div>
        <div id="saveFormContainer" style="display: none;">
            <div id="formFieldsCount" class="form-count"></div>
            <div id="multiEntryHint"  class="multi-entry-hint" style="display:none;"></div>
            <div class="form-group">
                <label for="profileLabel">Profile Name</label>
                <input type="text" id="profileLabel" placeholder="e.g. My Job Application" maxlength="60">
            </div>
            <div class="form-group">
                <label for="additionalUrls">Additional URLs <small style="font-weight:400;color:#6c757d;">(optional, one per line)</small></label>
                <textarea id="additionalUrls" placeholder="https://example.com/apply" rows="2"></textarea>
            </div>
            <button id="saveFormBtn" class="btn btn-primary" disabled>Save Form Data</button>
        </div>
    </div>
</div>

<!-- ── Saved Profiles ─────────────────────────────────── -->
<div class="section">
    <div class="section-title">📋 Saved Profiles for This Site</div>
    <div id="savedProfiles" class="saved-profiles">
        <div class="loading">Loading saved profiles...</div>
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
