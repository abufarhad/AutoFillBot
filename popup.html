<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Autofill Saver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: #f0f2f5;
            color: #212529;
        }

        /* ── Header ──────────────────────────────── */
        .header {
            background: #1a1d23;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.2px;
        }

        .site-bar {
            background: #fff;
            border-bottom: 1px solid #e2e5ea;
            padding: 8px 16px;
            font-size: 12px;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-bar strong { color: #495057; }

        /* ── Status message ──────────────────────── */
        #statusMessage {
            margin: 10px 16px 0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        #statusMessage.status-success { background: #d1fadf; color: #1a6632; border: 1px solid #a3d9b1; }
        #statusMessage.status-error   { background: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
        #statusMessage.status-info    { background: #dbeafe; color: #1e3a5f; border: 1px solid #93c5fd; }

        /* ── Sections ────────────────────────────── */
        .section {
            background: #fff;
            border-radius: 8px;
            margin: 12px 12px 0;
            overflow: hidden;
            border: 1px solid #e2e5ea;
        }

        .section-header {
            padding: 10px 14px 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #6c757d;
            background: #f8f9fa;
            border-bottom: 1px solid #e2e5ea;
        }

        /* ── Capture strip ───────────────────────── */
        .capture-strip {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #formStatus {
            font-size: 13px;
            color: #6c757d;
        }

        #formStatus.detected { color: #1a6632; font-weight: 500; }
        #formStatus.none     { color: #9b1c1c; }

        /* ── Profile list ─────────────────────────── */
        #profilesList { padding: 4px 0; }

        .profile-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #f0f2f5;
            gap: 10px;
        }

        .profile-item:last-child { border-bottom: none; }
        .profile-item:hover { background: #fafbfc; }

        .profile-item--global { background: #f8f0ff; }
        .profile-item--global:hover { background: #f3e8ff; }

        .profile-info { flex: 1; min-width: 0; }

        .profile-name {
            font-size: 13px;
            font-weight: 600;
            color: #212529;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-default {
            font-size: 10px;
            font-weight: 700;
            background: #7c3aed;
            color: #fff;
            padding: 1px 6px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .profile-meta {
            font-size: 11px;
            color: #adb5bd;
            margin-top: 2px;
        }

        .profile-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .empty-state {
            padding: 24px 16px;
            text-align: center;
            color: #adb5bd;
            font-size: 12px;
            line-height: 1.6;
        }

        /* ── Save form ────────────────────────────── */
        .save-section { padding: 12px 14px; }

        .save-row {
            display: flex;
            gap: 8px;
        }

        .save-row input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .save-row input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,.15); }

        /* ── Buttons ──────────────────────────────── */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: opacity .15s, background .15s;
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn-primary   { background: #7c3aed; color: #fff; }
        .btn-primary:not(:disabled):hover { background: #6d28d9; }

        .btn-success   { background: #059669; color: #fff; }
        .btn-success:not(:disabled):hover { background: #047857; }

        .btn-secondary { background: #e9ecef; color: #495057; }
        .btn-secondary:not(:disabled):hover { background: #dee2e6; }

        .btn-danger    { background: #dc3545; color: #fff; }
        .btn-danger:not(:disabled):hover { background: #c82333; }

        .btn-sm { padding: 4px 9px; font-size: 11px; }

        /* ── Footer ───────────────────────────────── */
        .footer {
            padding: 10px 12px 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Form Autofill Saver</h1>
        <button id="openDashboardBtn" class="btn btn-secondary btn-sm">Manage</button>
    </div>

    <div class="site-bar">
        <strong>Site:</strong> <span id="currentSiteUrl">Loading…</span>
    </div>

    <div id="statusMessage" style="display: none;"></div>

    <!-- Current form capture status -->
    <div class="section">
        <div class="section-header">Current Form</div>
        <div class="capture-strip">
            <span id="formStatus">Detecting fields…</span>
            <button id="captureBtn" class="btn btn-secondary btn-sm">Re-capture</button>
        </div>
    </div>

    <!-- All profiles -->
    <div class="section">
        <div class="section-header">Profiles</div>
        <div id="profilesList">
            <div class="empty-state">Loading profiles…</div>
        </div>
    </div>

    <!-- Save as new profile (shown only when form data exists) -->
    <div class="section" id="saveSection" style="display: none;">
        <div class="section-header">Save as New Profile</div>
        <div class="save-section">
            <div class="save-row">
                <input type="text" id="profileLabel" placeholder="Profile name, e.g. Software Engineer" maxlength="60">
                <button id="saveFormBtn" class="btn btn-primary" disabled>Save</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="openDashboardBtnFooter" class="btn btn-secondary btn-sm">Open Dashboard</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
